name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Unpack project
        run: unzip -q SellShop.zip

      - name: Build
        run: mvn -B package
        working-directory: SellShop

      - name: Get version
        id: ver
        run: |
          JAR=$(ls SellShop/target/SellShop-*.jar | grep -v original | head -n1)
          echo "jar=$JAR" >> $GITHUB_OUTPUT
          echo "name=$(basename "$JAR" .jar)" >> $GITHUB_OUTPUT

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: ${{ steps.ver.outputs.name }} (build ${{ github.run_number }})
          body_path: SellShop/RELEASE_NOTES.md
          files: ${{ steps.ver.outputs.jar }}
