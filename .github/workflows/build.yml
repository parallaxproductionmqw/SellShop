name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Unpack project
        run: unzip -q SellShop-repo.zip

      - name: Build
        run: mvn -B package
        working-directory: SellShop

      - uses: actions/upload-artifact@v4
        with:
          name: SellShop-jar
          path: SellShop/target/SellShop-*.jar
